<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__META_TITLE__ — ONLYOFFICE 在线编辑</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: -apple-system, "PingFang SC", sans-serif; }
    #placeholder { position: fixed; inset: 0; }
    .toast { position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
      background: rgba(17,24,39,.92); color: #fff; padding: 6px 14px; border-radius: 999px;
      font-size: 13px; z-index: 9999; opacity: 0; transition: opacity .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="placeholder"></div>
  <div class="toast" id="toast"></div>

  <script>
    const CONFIG = __CONFIG__            // 服务端注入：含 token 签名（JWT）
    const DOC_SERVER = '__DOC_SERVER__'  // DS 公网基址
    let toastTimer = null

    function toast(text) {
      const el = document.getElementById('toast')
      el.textContent = text
      el.classList.add('show')
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200)
    }

    // 关闭拼写检查。DS 把拼写检查结果直接画在文档 canvas 上，中文与专业术语会被
    // 英文词典判定为错词，整篇显示红色波浪线。服务端 config 已带
    // customization.spellcheck=false；这里在文档就绪后再调一次编辑器内部开关
    // （asc_setSpellCheck → Spelling.Use），兜住部分版本忽略该配置项的情况。
    // 编辑器与宿主页同源，可跨 iframe 访问；跨域或内部结构变化时静默跳过。
    function disableSpellCheck() {
      try {
        const frames = document.querySelectorAll('iframe')
        for (const frame of frames) {
          const editor = frame.contentWindow && frame.contentWindow.Asc && frame.contentWindow.Asc.editor
          const logicDoc = editor && editor.WordControl && editor.WordControl.m_oLogicDocument
          if (logicDoc && typeof editor.asc_setSpellCheck === 'function') {
            editor.asc_setSpellCheck(false)
            return true
          }
        }
      } catch (_) { /* 跨域 / 内部结构变化：忽略 */ }
      return false
    }

    // 文档对象异步就绪，短轮询重试直到关闭成功（上限 10s）
    function scheduleDisableSpellCheck() {
      let tries = 0
      const timer = setInterval(() => {
        tries += 1
        if (disableSpellCheck() || tries >= 20) clearInterval(timer)
      }, 500)
    }

    function bootEditor() {
      if (!window.DocsAPI) { toast('DocsAPI 未就绪'); return }
      const docEditor = new DocsAPI.DocEditor('placeholder', {
        ...CONFIG,
        events: {
          onAppReady: () => {
            toast('编辑器就绪，可直接编辑，保存自动回写')
            scheduleDisableSpellCheck()
          },
          onDocumentReady: () => scheduleDisableSpellCheck(),
          onDocumentStateChange: (e) => { if (e.data) toast('有未保存的修改…') },
          onError: (e) => toast('编辑器错误: ' + JSON.stringify(e)),
          onRequestClose: () => { try { docEditor.destroyEditor() } catch (_) {} },
        },
      })
      window.docEditor = docEditor
    }

    const script = document.createElement('script')
    script.src = DOC_SERVER + '/web-apps/apps/api/documents/api.js'
    script.onload = bootEditor
    script.onerror = () => toast('无法加载 Document Server（' + DOC_SERVER + '），请确认 DS 已启动且 api.js 可访问')
    document.head.appendChild(script)
  </script>
</body>
</html>
