<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AweeClaw Execution</title>
  <!-- 项目执行窗口：不透明背景、自定义标题栏、可调整大小 -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 不透明背景：与 globals.css 的 --background: 10 10 12 保持一致，避免色差闪烁 */
      background: #0a0a0c;
      /* 允许文本选择（执行窗口需要文本交互） */
      -webkit-user-select: none;
      user-select: none;
      /* 禁用拖拽默认行为 */
      -webkit-user-drag: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
    }
    /* 加载占位：React 挂载前显示简单的加载指示 */
    #execution-loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0c;
      color: #666;
      font-size: 13px;
      z-index: 100;
    }
    #execution-loader .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #333;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="execution-loader">
    <div class="spinner"></div>
    <span>加载执行窗口...</span>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/renderer/executionEntry.tsx"></script>
</body>

</html>
