<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D场景 - 一个精致的现代简约风格客厅室内3D场景，适合装修公司品牌展示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    canvas { display: block; }
    .info-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>

<body>
  <div id="canvas-container"></div>
  <div class="info-panel">拖拽旋转 · 滚轮缩放 · 右键平移</div>
  <div class="loading-overlay" id="loader">加载中...</div>
</body>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

// ============ 场景初始化 ============
const container = document.getElementById('canvas-container')
const scene = new THREE.Scene()

// 背景颜色
const bgColor = new THREE.Color('#f0f0f0')
scene.background = bgColor

// 相机
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000)
camera.position.set(0, 3, 8)

// 渲染器
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false })
renderer.setSize(window.innerWidth, window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
container.appendChild(renderer.domElement)

// 轨道控制器
const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true
controls.dampingFactor = 0.05
controls.maxDistance = 50
controls.minDistance = 2


// ============ 灯光系统 ============
// 环境光
const ambientLight = new THREE.AmbientLight(#ffffff, 0.3)
scene.add(ambientLight)

// 主平行光
const mainLight = new THREE.DirectionalLight(#ffffff, 0.8)
mainLight.position.set(5, 8, 5)
mainLight.castShadow = true
mainLight.shadow.mapSize.width = 2048
mainLight.shadow.mapSize.height = 2048
scene.add(mainLight)

// 半球光
const hemiLight = new THREE.HemisphereLight('#ffffff', '#000000', 0.3)
scene.add(hemiLight)


// ============ 物体创建 ============
// === 物体 1 ===
const geo0 = new THREE.SphereGeometry(
  1,  32,  32
)
const mat0 = new THREE.MeshStandardMaterial({
  color: '#3b82f6',
  metalness: 0.3,
  roughness: 0.5,
})
const mesh0 = new THREE.Mesh(geo0, mat0)
mesh0.castShadow = true
mesh0.receiveShadow = true
scene.add(mesh0)
const object0 = mesh0


// ============ 粒子系统 ============
// 无粒子效果


// ============ 网格地板 ============
// 无网格地板


// ============ 窗口自适应 ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(window.innerWidth, window.innerHeight)
})

// ============ 动画循环 ============
// ============ 动画循环 ============
const clock = new THREE.Clock()
let elapsed = 0

function animate() {
  requestAnimationFrame(animate)
  elapsed = clock.getElapsedTime()
  controls.update()

  // SphereGeometry 动画
  if (object0) {
    object0.rotation.y += 0.5 * 0.016
  }

  // 粒子旋转
  if (starField) starField.rotation.y += 0.0002

  renderer.render(scene, camera)
}

animate()


// ============ 加载完成 ============
setTimeout(() => {
  document.getElementById('loader').classList.add('hidden')
}, 300)

</script>

</html>
