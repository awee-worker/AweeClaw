<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AweeClaw Avatar</title>
  <!-- 悬浮头像窗口：透明背景、无滚动条、禁用文本选择 -->
  <style>
    /* 重置基础样式，确保透明窗口无白底 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 透明背景：让 BrowserWindow transparent:true 生效 */
      background: transparent !important;
      /* 禁用文本选择（悬浮头像不需要文本交互） */
      -webkit-user-select: none;
      user-select: none;
      /* 禁用拖拽默认行为（由自定义拖拽逻辑处理） */
      -webkit-user-drag: none;
    }
    #root {
      width: 100%;
      height: 100%;
    }
    /* 加载占位：React 挂载前显示。
       注意：不渲染任何可见元素（无紫色球），避免应用启动时先显示背景再出现头像的闪烁。
       头像图片由 AvatarStatic 组件在加载完成后淡入显示（opacity 0→1）。 */
    #avatar-loader {
      position: absolute;
      inset: 0;
      background: transparent;
    }
  </style>
</head>

<body>
  <div id="avatar-loader"></div>
  <div id="root"></div>
  <script type="module" src="/src/renderer/avatarEntry.tsx"></script>
</body>

</html>
