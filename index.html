<!DOCTYPE html>
<html lang="en" style="background:#09090b">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="%BASE_URL%brand/icons/app.png" />
  <title>AweeClaw</title>

  <script>
    (function () {
      var bg = '#121215';
      var loaderBg = '#121215';
      var isLight = false;
      try {
        var themeBg = localStorage.getItem('aweeclaw-theme-bg');
        var themeType = localStorage.getItem('aweeclaw-theme-type');

        if (themeBg) {
          if (themeBg.indexOf(' ') !== -1) {
            bg = 'rgb(' + themeBg.replace(/ /g, ', ') + ')';
            document.documentElement.style.setProperty('--background', themeBg);
          } else {
            bg = themeBg;
          }
          loaderBg = bg;
        } else {
          var themes = {
            'aweeclaw-dark': { bg: '#121215', twBg: '18 18 21' },
            'midnight': { bg: '#161B22', twBg: '22 27 34' },
            'cyberpunk': { bg: '#030305', twBg: '3 3 5' },
            'dawn': { bg: '#FFFFFF', twBg: '255 255 255' }
          };
          var themeId = localStorage.getItem('aweeclaw-theme-id');
          if (themeId && themes[themeId]) {
            bg = themes[themeId].bg;
            loaderBg = themes[themeId].bg;
            document.documentElement.style.setProperty('--background', themes[themeId].twBg);
            isLight = themeId === 'dawn';
          }
        }

        if (themeType === 'light') {
          isLight = true;
        }
      } catch (e) { }

      var publicBase = '%BASE_URL%';
      if (publicBase && publicBase.charAt(publicBase.length - 1) !== '/') {
        publicBase += '/';
      }

      document.documentElement.style.background = bg;
      document.documentElement.style.setProperty('--loader-bg', loaderBg);
      document.documentElement.style.setProperty('--loader-logo-url', 'url("' + publicBase + 'brand/logos/app.png")');

      if (isLight) {
        document.documentElement.style.setProperty('--loader-logo-url', 'url("' + publicBase + 'brand/logos/app-light.png")');
        document.documentElement.style.setProperty('--loader-text', '#1a1a2e');
        document.documentElement.style.setProperty('--loader-text-dim', '#6b7280');
        document.documentElement.style.setProperty('--loader-surface', '#f3f4f6');
        document.documentElement.style.setProperty('--loader-accent-rgb', '139, 92, 246');
        document.documentElement.style.setProperty('--loader-glow-opacity', '0.08');
        if (!document.documentElement.style.getPropertyValue('--background')) {
          document.documentElement.style.setProperty('--background', '255 255 255');
        }
        document.documentElement.style.setProperty('--surface', '241 243 245');
        document.documentElement.style.setProperty('--border', '222 226 230');
      }
    })();
  </script>

  <style>
    :root {
      --loader-bg: #121215;
      --loader-accent: #8b5cf6;
      --loader-accent-rgb: 139, 92, 246;
      --loader-text: #fafafa;
      --loader-text-dim: #71717a;
      --loader-surface: #18181b;
      --loader-logo-url: url('%BASE_URL%brand/logos/app.png');
      --loader-glow-opacity: 0.12;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      background: var(--loader-bg);
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #root {
      opacity: 0;
      pointer-events: none;
    }

    #root.ready {
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.15s ease-out;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      background: var(--loader-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #initial-loader.fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: reveal 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .loader-logo-container {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 36px;
    }

    .loader-logo-bg {
      position: absolute;
      inset: 0;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04),
        0 24px 48px rgba(0, 0, 0, 0.5);
      z-index: 2;
      overflow: hidden;
    }

    .loader-logo-icon {
      width: 100%;
      height: 100%;
      background-image: var(--loader-logo-url);
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .loader-glow {
      position: absolute;
      inset: -30px;
      background: radial-gradient(circle, rgba(var(--loader-accent-rgb), 0.35) 0%, transparent 65%);
      filter: blur(24px);
      animation: breathe 3s ease-in-out infinite;
      z-index: 1;
    }

    .loader-orbit {
      position: absolute;
      inset: -12px;
      border-radius: 38px;
      z-index: 3;
    }

    .loader-orbit-ring {
      position: absolute;
      inset: 0;
      border-radius: 38px;
      border: 1.5px solid transparent;
      background: conic-gradient(from 0deg, transparent 0%, rgba(var(--loader-accent-rgb), 0.6) 25%, transparent 50%) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: orbit 2.4s linear infinite;
    }

    .loader-orbit-dot {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--loader-accent);
      box-shadow: 0 0 8px rgba(var(--loader-accent-rgb), 0.8), 0 0 20px rgba(var(--loader-accent-rgb), 0.4);
      animation: orbitDot 2.4s linear infinite;
      top: -2.5px;
      left: 50%;
      margin-left: -2.5px;
    }

    .loader-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--loader-text);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .loader-subtitle {
      font-size: 12px;
      color: var(--loader-text-dim);
      margin-bottom: 44px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .loader-progress {
      width: 120px;
      height: 1.5px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 1px;
      overflow: hidden;
    }

    .loader-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, var(--loader-accent), transparent);
      border-radius: 1px;
      animation: shimmer 1.8s ease-in-out infinite;
    }

    .loader-status {
      margin-top: 16px;
      font-size: 11px;
      color: var(--loader-text-dim);
      opacity: 0.6;
      min-height: 16px;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes breathe {
      0%, 100% {
        opacity: var(--loader-glow-opacity);
        transform: scale(1);
      }
      50% {
        opacity: 0.22;
        transform: scale(1.08);
      }
    }

    @keyframes orbit {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes orbitDot {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(150%);
      }
      100% {
        transform: translateX(250%);
      }
    }
  </style>
</head>

<body>
  <div id="initial-loader">
    <div class="loader-content">
      <div class="loader-logo-container">
        <div class="loader-glow"></div>
        <div class="loader-orbit">
          <div class="loader-orbit-ring"></div>
          <div class="loader-orbit-dot"></div>
        </div>
        <div class="loader-logo-bg">
          <div class="loader-logo-icon" role="img" aria-label="AweeClaw"></div>
        </div>
      </div>
      <div class="loader-title">AweeClaw</div>
      <div class="loader-subtitle">Connect AI to Your World</div>
      <div class="loader-progress">
        <div class="loader-bar"></div>
      </div>
      <div class="loader-status"></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/renderer/bootstrap.tsx"></script>
</body>

</html>
