<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="%BASE_URL%brand/icons/app.png" />
  <title>AweeClaw</title>

  <script>
    (function () {
      // StorageService 使用 "aweeclaw:" 前缀和 JSON 包装格式 { v: value }
      function readStorageValue(key) {
        try {
          var raw = localStorage.getItem('aweeclaw:' + key);
          if (raw === null) return null;
          var entry = JSON.parse(raw);
          return entry.v !== undefined ? entry.v : null;
        } catch (e) {
          return null;
        }
      }

      var bg = '#f5faff';
      var loaderBg = '#f5faff';
      var isLight = true;
      try {
        var themeBg = readStorageValue('aweeclaw-theme-bg');
        var themeType = readStorageValue('aweeclaw-theme-mode');
        var themeId = readStorageValue('aweeclaw-theme-id');

        // 兜底：如果 theme-mode 读不到，从 theme-type 推断
        if (!themeType) {
          themeType = readStorageValue('aweeclaw-theme-type');
        }

        var themes = {
          'aweeclaw-dark': { bg: '#161b22', twBg: '22 27 34', light: false },
          'aweeclaw-light': { bg: '#f5faff', twBg: '245 252 255', light: true },
          'purple-dark': { bg: '#121215', twBg: '18 18 21', light: false },
          'purple-light': { bg: '#f8f5ff', twBg: '248 245 255', light: true },
          'lobster-red-dark': { bg: '#140e0c', twBg: '20 14 12', light: false },
          'lobster-red-light': { bg: '#fffcf9', twBg: '255 252 249', light: true },
          'forest-green-dark': { bg: '#0e1614', twBg: '14 22 20', light: false },
          'forest-green-light': { bg: '#f5fcfc', twBg: '245 252 252', light: true },
        };

        if (themeBg) {
          if (themeBg.indexOf(' ') !== -1) {
            bg = 'rgb(' + themeBg.replace(/ /g, ', ') + ')';
            document.documentElement.style.setProperty('--background', themeBg);
          } else {
            bg = themeBg;
          }
          loaderBg = bg;
        }

        if (themeType === 'dark') {
          isLight = false;
        } else if (themeType === 'light') {
          isLight = true;
        } else if (themeId && themes[themeId]) {
          isLight = themes[themeId].light;
          if (!themeBg) {
            bg = themes[themeId].bg;
            loaderBg = themes[themeId].bg;
            document.documentElement.style.setProperty('--background', themes[themeId].twBg);
          }
        } else if (!themeBg) {
          var themeIdFromSettings = readStorageValue('themeId');
          if (themeIdFromSettings && themes[themeIdFromSettings]) {
            isLight = themes[themeIdFromSettings].light;
            bg = themes[themeIdFromSettings].bg;
            loaderBg = themes[themeIdFromSettings].bg;
            document.documentElement.style.setProperty('--background', themes[themeIdFromSettings].twBg);
          } else if (themeIdFromSettings && themeIdFromSettings.endsWith('-dark')) {
            isLight = false;
            bg = '#161b22';
            loaderBg = '#161b22';
            document.documentElement.style.setProperty('--background', '22 27 34');
          }
        }
      } catch (e) { }

      var publicBase = '%BASE_URL%';
      if (publicBase && publicBase.charAt(publicBase.length - 1) !== '/') {
        publicBase += '/';
      }

      document.documentElement.style.background = bg;
      document.documentElement.style.setProperty('--loader-bg', loaderBg);
      document.documentElement.style.setProperty('--loader-logo-url', 'url("' + publicBase + 'brand/logos/app.png")');

      if (isLight) {
        document.documentElement.style.setProperty('--loader-logo-url', 'url("' + publicBase + 'brand/logos/app-light.png")');
        document.documentElement.style.setProperty('--loader-text', '#1a1a2e');
        document.documentElement.style.setProperty('--loader-text-dim', '#6b7280');
        document.documentElement.style.setProperty('--loader-surface', '#f3f4f6');
        document.documentElement.style.setProperty('--loader-accent-rgb', '139, 92, 246');
        document.documentElement.style.setProperty('--loader-glow-opacity', '0.08');
        if (!document.documentElement.style.getPropertyValue('--background')) {
          document.documentElement.style.setProperty('--background', '255 255 255');
        }
        document.documentElement.style.setProperty('--surface', '241 243 245');
        document.documentElement.style.setProperty('--border', '222 226 230');
      } else {
        // 暗色主题：文字使用浅色，确保在深色背景上清晰可读
        document.documentElement.style.setProperty('--loader-logo-url', 'url("' + publicBase + 'brand/logos/app.png")');
        document.documentElement.style.setProperty('--loader-text', '#f5f5f7');
        document.documentElement.style.setProperty('--loader-text-dim', '#9ca3af');
        document.documentElement.style.setProperty('--loader-surface', '#1f2937');
        document.documentElement.style.setProperty('--loader-accent-rgb', '139, 92, 246');
        document.documentElement.style.setProperty('--loader-glow-opacity', '0.15');
      }
    })();
  </script>

  <style>
    :root {
      --loader-bg: #f5faff;
      --loader-accent: #39bef8;
      --loader-accent-rgb: 139, 92, 246;
      --loader-accent2-rgb: 59, 130, 246;
      --loader-text: #1a1a2e;
      --loader-text-dim: #6b7280;
      --loader-surface: #f3f4f6;
      --loader-logo-url: url('%BASE_URL%brand/logos/app-light.png');
      --loader-glow-opacity: 0.08;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      background: var(--loader-bg);
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #root {
      opacity: 0;
      pointer-events: none;
    }

    #root.ready {
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.15s ease-out;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      background: var(--loader-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #initial-loader.fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease-out;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: reveal 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Logo 容器 */
    .loader-logo-container {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 40px;
    }

    .loader-logo-bg {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 20px 40px rgba(0, 0, 0, 0.5);
      z-index: 2;
      overflow: hidden;
    }

    .loader-logo-icon {
      width: 100%;
      height: 100%;
      background-image: var(--loader-logo-url);
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* 底层光晕 - 柔和呼吸 */
    .loader-glow {
      position: absolute;
      inset: -40px;
      background: radial-gradient(circle, rgba(var(--loader-accent-rgb), 0.3) 0%, transparent 60%);
      filter: blur(28px);
      animation: breathe 3.5s ease-in-out infinite;
      z-index: 1;
    }

    /* 外层轨道环 - 双层旋转 */
    .loader-orbit {
      position: absolute;
      inset: -16px;
      border-radius: 36px;
      z-index: 3;
    }

    .loader-orbit-ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 36px;
      border: 1px solid transparent;
      background: conic-gradient(from 0deg, transparent 0%, rgba(var(--loader-accent-rgb), 0.4) 20%, transparent 40%) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: orbit 3s linear infinite;
    }

    .loader-orbit-ring-inner {
      position: absolute;
      inset: 8px;
      border-radius: 30px;
      border: 1px solid transparent;
      background: conic-gradient(from 180deg, transparent 0%, rgba(var(--loader-accent2-rgb), 0.3) 20%, transparent 40%) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: orbit 2.2s linear infinite reverse;
    }

    /* 轨道上的发光粒子 */
    .loader-orbit-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--loader-accent);
      box-shadow: 0 0 6px rgba(var(--loader-accent-rgb), 0.9), 0 0 16px rgba(var(--loader-accent-rgb), 0.4);
      animation: orbitDot 3s linear infinite;
      top: -2px;
      left: 50%;
      margin-left: -2px;
      z-index: 4;
    }

    .loader-orbit-dot-2 {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(var(--loader-accent2-rgb), 1);
      box-shadow: 0 0 5px rgba(var(--loader-accent2-rgb), 0.8), 0 0 12px rgba(var(--loader-accent2-rgb), 0.3);
      animation: orbitDot2 2.2s linear infinite reverse;
      bottom: 6px;
      right: -1.5px;
      z-index: 4;
    }

    /* 标题区域 */
    .loader-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--loader-text);
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .loader-subtitle {
      font-size: 11px;
      color: var(--loader-text-dim);
      margin-bottom: 48px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
      opacity: 0.7;
    }

    /* 进度指示器 - 三点脉冲 */
    .loader-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 20px;
    }

    .loader-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--loader-accent);
      opacity: 0.3;
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    .loader-dot:nth-child(1) { animation-delay: 0s; }
    .loader-dot:nth-child(2) { animation-delay: 0.2s; }
    .loader-dot:nth-child(3) { animation-delay: 0.4s; }

    /* 状态文字 */
    .loader-status {
      margin-top: 14px;
      font-size: 11px;
      color: var(--loader-text-dim);
      opacity: 0.5;
      min-height: 16px;
      transition: opacity 0.3s ease;
    }

    /* 底部装饰线 */
    .loader-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--loader-accent-rgb), 0.15), transparent);
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes breathe {
      0%, 100% {
        opacity: var(--loader-glow-opacity);
        transform: scale(1);
      }
      50% {
        opacity: 0.2;
        transform: scale(1.06);
      }
    }

    @keyframes orbit {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes orbitDot {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes orbitDot2 {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes dotPulse {
      0%, 80%, 100% {
        opacity: 0.3;
        transform: scale(1);
      }
      40% {
        opacity: 1;
        transform: scale(1.5);
      }
    }
  </style>
</head>

<body>
  <div id="initial-loader">
    <div class="loader-content">
      <div class="loader-logo-container">
        <div class="loader-glow"></div>
        <div class="loader-orbit">
          <div class="loader-orbit-ring-outer"></div>
          <div class="loader-orbit-ring-inner"></div>
          <div class="loader-orbit-dot"></div>
          <div class="loader-orbit-dot-2"></div>
        </div>
        <div class="loader-logo-bg">
          <div class="loader-logo-icon" role="img" aria-label="AweeClaw"></div>
        </div>
      </div>
      <div class="loader-title">AweeClaw</div>
      <div class="loader-subtitle">Connect AI to Your World</div>
      <div class="loader-dots">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
      </div>
      <div class="loader-status"></div>
    </div>
    <div class="loader-line"></div>
  </div>
  <div id="root"></div>
  <script>
    // 全局错误捕获：在 React 加载前捕获模块加载错误
    // 过滤良性警告，仅显示真正的启动错误
    var BENIGN_ERRORS = [
      'ResizeObserver loop completed with undelivered notifications',
      'ResizeObserver loop limit exceeded',
    ];
    function isBenignError(msg) {
      if (!msg) return false;
      var m = String(msg);
      return BENIGN_ERRORS.some(function (b) { return m.indexOf(b) !== -1; });
    }
    window.addEventListener('error', function (e) {
      if (isBenignError(e.message)) return;
      var statusEl = document.querySelector('#initial-loader .loader-status');
      if (statusEl) {
        statusEl.textContent = 'Error: ' + (e.message || 'Unknown error');
        statusEl.style.color = '#ff6b6b';
        statusEl.style.opacity = '1';
        statusEl.style.maxWidth = '400px';
        statusEl.style.wordBreak = 'break-all';
        statusEl.style.textAlign = 'center';
        statusEl.style.padding = '0 20px';
      }
      console.error('[Global Error Handler]', e.error || e.message);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var reason = e.reason;
      var msg = reason && reason.message ? reason.message : reason;
      if (isBenignError(msg)) return;
      var statusEl = document.querySelector('#initial-loader .loader-status');
      if (statusEl) {
        statusEl.textContent = 'Promise Error: ' + (msg || 'Unknown');
        statusEl.style.color = '#ff6b6b';
        statusEl.style.opacity = '1';
      }
      console.error('[Global Unhandled Rejection]', reason);
    });
  </script>
  <script>
    // 超时兜底：30 秒后强制移除加载动画，防止初始化异常导致界面永久卡死
    // 正常情况下由 useAppInit 在初始化完成后移除
    window.setTimeout(function () {
      var loader = document.getElementById('initial-loader')
      var root = document.getElementById('root')
      if (root) root.classList.add('ready')
      if (loader) {
        loader.classList.add('fade-out')
        setTimeout(function () { loader.remove() }, 300)
      }
    }, 30000)
  </script>
  <script type="module" src="/src/renderer/bootstrap.tsx"></script>
</body>

</html>
